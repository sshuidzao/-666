<style>
  :root{
    --bg:#f6f7f5; --card:#fff; --ink:#14181b; --ink2:#3c444c; --muted:#7c838c;
    --line:#e7e9e5; --accent:#12945a; --accent2:#0d7446; --soft:#e7f5ed;
    --warn:#a9560a; --warnbg:#fdf2e3; --danger:#b3261e;
    --r:16px; --shadow:0 1px 2px rgba(16,24,40,.05),0 10px 26px -18px rgba(16,24,40,.35);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink)}
  body{
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
    padding:0 14px calc(28px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
    max-width:560px;margin:0 auto;
  }
  header{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 2px 12px}
  .brand{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:650;letter-spacing:-.01em}
  .brand i{width:9px;height:9px;border-radius:50%;background:var(--accent);display:block}
  .brand small{font-size:11.5px;color:var(--muted);font-weight:500;margin-left:2px}
  .iconbtn{border:0;background:#ecedea;border-radius:11px;width:36px;height:36px;font-size:16px;color:var(--ink2);display:grid;place-items:center}
  .iconbtn:active{background:#e2e4e0}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:15px;margin-bottom:12px}
  .card h2{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted);margin:0 0 10px}

  /* 决策卡 */
  #decision{border-left:3px solid var(--accent)}
  #decision.warn{border-left-color:var(--warn)}
  #decision.idle{border-left-color:#c9cdc6}
  .tag{display:inline-block;font-size:11px;font-weight:650;padding:2px 7px;border-radius:6px;background:var(--soft);color:var(--accent2);margin-bottom:8px}
  .tag.warn{background:var(--warnbg);color:var(--warn)}
  .tag.idle{background:#eef0ec;color:var(--muted)}
  .d-title{font-size:19px;font-weight:660;letter-spacing:-.015em;line-height:1.35;margin:0 0 10px}
  .d-action{font-size:15px;font-weight:550;line-height:1.5;margin:0 0 10px;padding:11px 12px;background:#f7f9f7;border-radius:11px}
  .d-row{display:flex;gap:6px;font-size:13px;color:var(--muted);line-height:1.55;margin-top:7px}
  .d-row b{font-weight:600;color:var(--ink2);flex:0 0 auto}
  .d-btns{display:flex;gap:8px;margin-top:12px}
  .d-btns button{
    flex:1;padding:11px;border:1px solid var(--line);border-radius:11px;background:#fff;
    font:inherit;font-size:14px;font-weight:550;color:var(--ink2);
  }
  .d-btns button:first-child{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:620}
  .d-btns button:active{opacity:.86}
  .d-btns button[disabled]{background:#eef0ec;border-color:var(--line);color:var(--muted);font-weight:550}
  .notes{margin:11px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
  .notes li{font-size:12.5px;line-height:1.55;color:var(--ink2);background:#fbfbf9;border:1px solid #eef0ec;border-radius:9px;padding:8px 10px}

  /* KPI */
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:11px 12px;box-shadow:var(--shadow)}
  .kpi .k{font-size:11px;color:var(--muted)}
  .kpi .v{font-size:21px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:1px}
  .kpi .v small{font-size:11.5px;font-weight:500;color:var(--muted);margin-left:2px}
  .kpi .n{font-size:11px;color:var(--muted);margin-top:1px}
  .kpi .n.good{color:var(--accent2)} .kpi .n.bad{color:var(--warn)}

  /* 打卡 */
  .entry-main{display:flex;gap:9px;align-items:stretch}
  .wfield{flex:1;position:relative}
  .wfield input{
    width:100%;font-size:32px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;
    border:1px solid var(--line);border-radius:13px;padding:12px 46px 12px 14px;background:#fbfcfa;color:var(--ink);
  }
  .wfield input:focus{outline:2px solid var(--soft);border-color:var(--accent);background:#fff}
  .wfield span{position:absolute;right:14px;bottom:16px;font-size:13px;color:var(--muted)}
  .savebtn{
    flex:0 0 92px;border:0;border-radius:13px;background:var(--accent);color:#fff;font-size:15px;font-weight:620;
  }
  .savebtn:active{background:var(--accent2)}
  .savebtn:disabled{background:#cbd2cb}
  details{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
  summary{font-size:12.5px;color:var(--muted);list-style:none;display:flex;align-items:center;gap:5px;padding:4px 0}
  summary::-webkit-details-marker{display:none}
  summary::after{content:'▾';font-size:10px;margin-left:auto;transition:.2s}
  details[open] summary::after{transform:rotate(180deg)}
  .more{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}
  .more label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted)}
  input[type=number],input[type=date],select{
    font:inherit;font-size:15px;color:var(--ink);background:#fbfcfa;border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;
    font-variant-numeric:tabular-nums;
  }
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .row1{display:grid;grid-template-columns:1fr;gap:9px}

  /* 图 */

<body>

<header>
  <div class="brand"><i></i>FitLoop<small>减脂周复盘</small></div>
  <button class="iconbtn" id="btnSettings" aria-label="设置">⚙</button>
</header>

<!-- 本周建议 -->
<section class="card" id="decision"></section>

<!-- KPI -->
<section class="kpis" id="kpis"></section>

<!-- 打卡 -->
<section class="card">
  <h2>今日记录</h2>
  <form id="entryForm" autocomplete="off">
    <div class="entry-main">
      <div class="wfield">
        <input id="wInput" name="weight" type="number" inputmode="decimal" step="0.1" min="25" max="300" placeholder="晨重" aria-label="晨起空腹体重">
        <span>kg</span>
      </div>
      <button class="savebtn" type="submit" id="saveBtn">保存</button>
    </div>
    <details>
      <summary>更多（热量、蛋白、步数、睡眠…）</summary>
      <div class="more">
        <label>今天日期<input name="date" type="date"></label>
        <label>摄入 kcal<input name="kcal" type="number" inputmode="numeric" step="10" min="0" placeholder="大概就行"></label>
        <label>蛋白质 g<input name="protein" type="number" inputmode="numeric" step="1" min="0" placeholder="可选"></label>
        <label>步数<input name="steps" type="number" inputmode="numeric" step="100" min="0" placeholder="可选"></label>
        <label>有氧 分钟<input name="cardio" type="number" inputmode="numeric" step="5" min="0" placeholder="可选"></label>
        <label>睡眠 小时<input name="sleep" type="number" inputmode="decimal" step="0.5" min="0" placeholder="可选"></label>
      </div>
      <div class="checkline"><input type="checkbox" name="lifting" id="lifting"> <label for="lifting">今天力量训练了</label></div>
    </details>
  </form>
</section>

<!-- 训练（L1：部位 + 时长 + RPE） -->
<section class="card">
  <h2>训练 · <span id="trainDateLabel">今天</span></h2>
  <form id="trainForm" autocomplete="off">
    <div class="chips" id="chips">
      <button type="button" class="chip" data-type="push">推</button>
      <button type="button" class="chip" data-type="pull">拉</button>
      <button type="button" class="chip" data-type="legs">腿</button>
      <button type="button" class="chip" data-type="full">全身</button>
      <button type="button" class="chip" data-type="cardio">有氧</button>
      <button type="button" class="chip" data-type="rest">休息</button>
    </div>
    <div class="train-row">
      <label class="f">时长 分钟<input name="trainMin" type="number" inputmode="numeric" step="5" min="0" max="300" placeholder="60"></label>
      <label class="f">强度 RPE<select name="rpe">
        <option value="">—</option>
        <option value="6">6 · 轻松</option>
        <option value="7">7 · 还有点余力</option>
        <option value="8">8 · 再 1–2 次</option>
        <option value="9">9 · 只差 1 次</option>
        <option value="10">10 · 力竭</option>
      </select></label>
    </div>
    <label class="f" style="margin-top:9px">备注（可选）<input name="note" type="text" maxlength="40" placeholder="例：卧推 60×8×3"></label>
    <div class="formfoot">
      <span class="hint" id="trainHint">点一个部位，再保存</span>
      <button type="submit">存训练</button>
    </div>
  </form>
  <div class="train-sum" id="trainSum"></div>
</section>

<!-- 趋势 -->
<section class="card">
  <h2>体重趋势</h2>
  <canvas id="chart" height="230"></canvas>
  <div class="legend">
    <span><i></i>7 日均线</span>
    <span><i class="dash"></i>目标</span>
  </div>
</section>

<!-- 最近 -->
<section class="card">
  <h2>最近记录</h2>
  <div class="list" id="list"></div>
</section>

<div class="footer">
  <button id="btnExport">导出备份</button>
  <button id="btnImport">导入备份</button>
</div>

<!-- 设置弹层 -->
<div class="sheet" id="sheet">
  <div class="sheet-inner">
    <h3>身体数据</h3>
    <p class="sub">只用来算维持热量和目标缺口，随时可改。改动会展示新的目标。</p>
    <form id="profileForm" autocomplete="off">
      <div class="row2">
        <label class="f">性别<select name="sex"><option value="m">男</option><option value="f">女</option></select></label>
        <label class="f">年龄<input name="age" type="number" min="14" max="90" step="1" required></label>
      </div>
      <div class="row2" style="margin-top:9px">
        <label class="f">身高 cm<input name="height" type="number" min="120" max="230" step="0.5" required></label>
        <label class="f">当前体重 kg<input name="weight" type="number" min="25" max="300" step="0.1" required></label>
      </div>
      <div class="row2" style="margin-top:9px">
        <label class="f">目标体重 kg<input name="goal" type="number" min="25" max="300" step="0.1" required></label>
        <label class="f">活动量<select name="activity">
          <option value="1.2">久坐</option>
          <option value="1.375">轻度（1–3 次/周）</option>
          <option value="1.55">中度（3–5 次/周）</option>
          <option value="1.725">高度（每天训练）</option>
        </select></label>
      </div>
      <div class="row2" style="margin-top:9px">
        <label class="f">目标速度<select name="ratePct">
          <option value="0.5">0.5%/周 · 稳</option>
          <option value="0.75">0.75%/周 · 推荐</option>
          <option value="1">1%/周 · 快</option>
        </select></label>
        <label class="f">蛋白 g/kg<input name="proteinPerKg" type="number" min="1.2" max="2.6" step="0.1"></label>
      </div>
      <div class="checkline"><input type="checkbox" name="cardioFirst" id="cardioFirst"><label for="cardioFirst">平台期优先加步数/有氧，而不是继续少吃饭</label></div>
      <div class="btnrow">
        <button type="button" id="closeSheet">取消</button>
        <button type="submit" class="primary">保存</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="fileInput" accept="application/json,.json" hidden>

<script>
/* FitLoop — 纯逻辑层（无 DOM、无副作用，可在 Node 里直接测试）
 * 约定：所有日期是本地时区的 'YYYY-MM-DD'；体重单位 kg；热量 kcal。
 */
(function (root, factory) {
  var api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.FitLogic = api;
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  /* ---------------- 日期 ---------------- */
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function fmtDate(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseDate(s) { var a = s.split('-'); return new Date(+a[0], +a[1] - 1, +a[2]); }
  function addDays(s, n) { var d = parseDate(s); d.setDate(d.getDate() + n); return fmtDate(d); }
  function dayDiff(a, b) { return Math.round((parseDate(b) - parseDate(a)) / 86400000); }
  function todayStr() { return fmtDate(new Date()); }
  function weekdayCN(s) { return '日一二三四五六'[parseDate(s).getDay()]; }
  function shortCN(s) { var a = s.split('-'); return (+a[1]) + '/' + (+a[2]); }

  /* ---------------- 数字 ---------------- */
  function num(v) { var n = parseFloat(v); return isFinite(n) ? n : null; }
  function fmt(n, d) {
    if (n === null || n === undefined || !isFinite(n)) return '—';
    return n.toFixed(d === undefined ? 1 : d);
  }
  function pct(n, d) {
    if (!isFinite(n)) return '—';
    return (n > 0 ? '+' : '') + n.toFixed(d === undefined ? 2 : d) + '%';
  }

  /* ---------------- 目标估算 ---------------- */
  function targets(p) {
    var bmr = 10 * p.weight + 6.25 * p.height - 5 * p.age + (p.sex === 'm' ? 5 : -161);
    var tdee = bmr * p.activity;
    var deficitKcal = 7700 * (p.ratePct / 100 * p.weight) / 7;
    var rawKcal = tdee - deficitKcal;
    var floor = Math.max(bmr, p.sex === 'm' ? 1500 : 1200);
    var kcal = Math.max(rawKcal, floor);
    var clamped = kcal > rawKcal + 0.5;
    var protein = p.proteinPerKg * p.weight;
    var fat = Math.max(0.6 * p.weight, kcal * 0.22 / 9);
    var carbs = Math.max(0, (kcal - protein * 4 - fat * 9) / 4);
    return {
      bmr: bmr, tdee: tdee, deficitKcal: deficitKcal, rawKcal: rawKcal,
      kcal: kcal, floor: floor, clamped: clamped,
      protein: protein, fat: fat, carbs: carbs,
      expectedLossPct: (tdee - kcal) * 7 / 7700 / p.weight * 100
    };
  }

  /* ---------------- 体重序列 ---------------- */
  function weightPoints(entries) {
    return entries
      .filter(function (e) { return e && e.weight > 0 && /^\d{4}-\d{2}-\d{2}$/.test(e.date); })
      .map(function (e) { return { date: e.date, w: e.weight }; })
      .sort(function (a, b) { return a.date < b.date ? -1 : 1; });
  }

  function weightMap(points) {
    var m = {};
    points.forEach(function (p) { m[p.date] = p.w; });
    return m;
  }

  function ma7At(map, dateStr) {
    var sum = 0, c = 0;
    for (var i = 0; i < 7; i++) {
      var d = addDays(dateStr, -i);
      if (map[d] !== undefined) { sum += map[d]; c++; }
    }
    return c ? sum / c : null;
  }

  /* 给每个点附上 7 日均线，用于画图 */
  function maSeries(points) {
    var map = weightMap(points);
    return points.map(function (p) {
      return { date: p.date, w: p.w, ma7: ma7At(map, p.date) };
    });
  }

  /* 多窗口变化：7 / 14 / 28 天，基于 7 日均线的首尾差 */
  function windowDelta(points, days) {
    if (!points.length) return null;
    var map = weightMap(points);
    var last = points[points.length - 1].date;
    var now = ma7At(map, last);
    var before = ma7At(map, addDays(last, -days));
    if (now === null || before === null || before <= 0) return null;
    var weeks = days / 7;
    var kg = now - before;
    return {
      days: days, kg: kg, perWeek: kg / weeks,
      pctPerWeek: (kg / weeks) / before * 100,
      from: before, to: now, endDate: last
    };
  }

  /* 最小二乘：最后 n 天体重的斜率（kg/周）。比首尾两点稳。 */
  function slopePerWeek(points, n) {
    n = n || 21;
    if (points.length < 2) return null;
    var last = points[points.length - 1].date;
    var xs = [], ys = [];
    points.forEach(function (p) {
      var d = -dayDiff(p.date, last); // 负数，今天为 0
      if (d >= -(n - 1)) { xs.push(d); ys.push(p.w); }
    });
    if (xs.length < 2) return null;
    var mx = xs.reduce(function (s, v) { return s + v; }, 0) / xs.length;
    var my = ys.reduce(function (s, v) { return s + v; }, 0) / ys.length;
    var numr = 0, den = 0;
    for (var i = 0; i < xs.length; i++) {
      numr += (xs[i] - mx) * (ys[i] - my);
      den += (xs[i] - mx) * (xs[i] - mx);
    }
    if (den === 0) return null;
    var kgPerDay = numr / den;
    return { kgPerWeek: kgPerDay * 7, pctPerWeek: (kgPerDay * 7) / my * 100, n: xs.length, mean: my };
  }

  /* ---------------- 自适应 TDEE ---------------- */
  /* 用「平均摄入 + 实际掉秤速度」反推真实消耗，比公式更贴个人。
   * tdee = 平均热量 + 掉秤速度(kg/周) * 7700 / 7
   * 注意：掉秤速度用回归斜率算，不能用 7 日均线首尾差——均线有滞后，
   * 首尾两端各丢约 3 天，会把 21 天算成 14 天，低估消耗。
   */
  function adaptiveTdee(entries, opts) {
    opts = opts || {};
    var windowDays = opts.windowDays || 21;
    var pts = weightPoints(entries);
    if (!pts.length) return { ok: false, reason: 'no-weight' };
    var endDate = pts[pts.length - 1].date;
    var startDate = addDays(endDate, -(windowDays - 1));
    var inWin = entries.filter(function (e) { return e.date >= startDate && e.date <= endDate; });
    var kcalDays = inWin.filter(function (e) { return e.kcal > 0; });
    var span = dayDiff(startDate, endDate) + 1;
    var wCount = inWin.filter(function (e) { return e.weight > 0; }).length;
    var slope = slopePerWeek(pts, windowDays);

    if (kcalDays.length < 8 || wCount < 8 || span < 14 || !slope) {
      return {
        ok: false, reason: 'not-enough-data',
        have: { kcalDays: kcalDays.length, weightDays: wCount, span: span },
        need: { kcalDays: 8, weightDays: 8, span: 14 }
      };
    }
    var map = weightMap(pts);
    var wEnd = ma7At(map, endDate);
    var wStart = ma7At(map, startDate);

    var avgKcal = kcalDays.reduce(function (s, e) { return s + e.kcal; }, 0) / kcalDays.length;
    var kgPerWeek = slope.kgPerWeek;              // 负 = 在掉秤
    var lossPerWeek = -kgPerWeek;
    var tdeeEst = avgKcal + lossPerWeek * 7700 / 7;

    return {
      ok: true, tdee: tdeeEst, avgKcal: avgKcal,
      kgPerWeek: kgPerWeek,
      lossPerWeek: lossPerWeek,
      deltaKg: kgPerWeek * (span / 7),
      pctPerWeek: slope.mean > 0 ? (lossPerWeek / slope.mean) * 100 : 0,
      span: span, kcalDays: kcalDays.length, weightDays: wCount,
      wStart: wStart, wEnd: wEnd,
      src: { start: startDate, end: endDate }
    };
  }

  /* ---------------- 一周数据概览 ---------------- */
  function recentStats(entries, today) {
    today = today || todayStr();
    var from = addDays(today, -6);
    var win = entries.filter(function (e) { return e.date >= from && e.date <= today; });
    var cal = win.filter(function (e) { return e.kcal > 0; });
    var pro = win.filter(function (e) { return e.protein > 0; });
    var stp = win.filter(function (e) { return e.steps > 0; });
    var slp = win.filter(function (e) { return e.sleep > 0; });
    function avg(arr, k) {
      return arr.length ? arr.reduce(function (s, e) { return s + e[k]; }, 0) / arr.length : null;
    }
    return {
      days: win.length,
      kcalDays: cal.length, avgKcal: avg(cal, 'kcal'),
      proteinDays: pro.length, avgProtein: avg(pro, 'protein'),
      stepsDays: stp.length, avgSteps: avg(stp, 'steps'),
      sleepDays: slp.length, avgSleep: avg(slp, 'sleep')
    };
  }

  function streakDays(entries, today) {
    today = today || todayStr();
    var set = {};
    entries.forEach(function (e) { if (e.weight > 0) set[e.date] = true; });
    var n = 0, cur = set[today] ? today : addDays(today, -1);
    while (set[cur]) { n++; cur = addDays(cur, -1); }
    return n;
  }

  /* 进度：以第一条体重为起点，当前为终点 */
  function progress(entries, profile) {
    var pts = weightPoints(entries);
    var startW = pts.length ? pts[0].w : (profile ? profile.weight : null);
    var cur = pts.length ? pts[pts.length - 1].w : startW;
    var goal = profile ? profile.goal : null;
    if (startW === null || goal === null) {
      return { start: startW, current: cur, goal: goal, remain: null, donePct: 0, total: null };
    }
    var total = startW - goal;
    var donePct = total > 0 ? Math.min(100, Math.max(0, (startW - cur) / total * 100)) : 0;
    return { start: startW, current: cur, goal: goal, remain: cur - goal, donePct: donePct, total: total };
  }

  /* ---------------- 训练（L1：部位 + 时长 + RPE） ---------------- */
  var TRAIN_TYPES = {
    push: { label: '推', strength: true },
    pull: { label: '拉', strength: true },
    legs: { label: '腿', strength: true },
    full: { label: '全身', strength: true },
    cardio: { label: '有氧', strength: false },
    rest: { label: '休息', strength: false }
  };

  function isTraining(e) { return e && e.trainType && e.trainType !== 'rest'; }

  /* 近 7 天 / 上周 / 近 4 周的训练量，只用来做趋势与保肌提示 */
  function trainingStats(entries, today) {
    today = today || todayStr();
    var train = entries.filter(isTraining).sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    var d7 = addDays(today, -6);
    var week = train.filter(function (e) { return e.date >= d7 && e.date <= today; });
    var prevStart = addDays(today, -13), prevEnd = addDays(today, -7);
    var prevWeek = train.filter(function (e) { return e.date >= prevStart && e.date <= prevEnd; });
    var last = train.length ? train[0] : null;

    // 近 4 个 7 天桶（从最早到最近）
    var origin = addDays(today, -27);
    var buckets = [0, 0, 0, 0];
    train.forEach(function (e) {
      var k = Math.floor(dayDiff(origin, e.date) / 7);
      if (k >= 0 && k <= 3) buckets[k]++;
    });

    function sumMin(arr) {
      return arr.reduce(function (s, e) { return s + (e.trainMin || 0); }, 0);
    }

    return {
      weekCount: week.length,
      weekMinutes: sumMin(week),
      prevWeekCount: prevWeek.length,
      prevWeekMinutes: sumMin(prevWeek),
      byWeek: buckets,
      lastType: last ? last.trainType : null,
      lastTypeLabel: last && TRAIN_TYPES[last.trainType] ? TRAIN_TYPES[last.trainType].label : null,
      lastDate: last ? last.date : null,
      lastDaysAgo: last ? dayDiff(last.date, today) : null,
      strengthThisWeek: week.filter(function (e) { return TRAIN_TYPES[e.trainType] && TRAIN_TYPES[e.trainType].strength; }).length
    };
  }

  /* ---------------- 决策引擎 ---------------- */
  /* 返回：{ status, tag, title, action, reason, expected, notes[] }
   * 原则：一次只给一条动作；数据不足时不给动作。
   */
  function decide(ctx) {
    var p = ctx.profile, t = ctx.target, entries = ctx.entries;
    var pts = weightPoints(entries);
    var today = ctx.today || todayStr();
    var notes = [];

    if (pts.length < 5) {
      return {
        status: 'need-data', tag: '先记数据',
        title: '还判断不了，先记 ' + (5 - pts.length) + ' 天',
        action: '继续每天记晨重（空腹、起床后、上完厕所）。',
        reason: '趋势至少需要 5 个点，建议 10 天以上才谈调整。',
        expected: '攒够数据后，这里会给出本周唯一一条调整。',
        notes: notes
      };
    }

    var last = pts[pts.length - 1].date;
    var spanDays = dayDiff(pts[0].date, last);
    if (spanDays < 9) {
      return {
        status: 'need-data', tag: '先记数据',
        title: '已记 ' + pts.length + ' 天，再等 ' + (10 - spanDays) + ' 天',
        action: '先不要改任何东西。',
        reason: '10 天内掉的那点重量，很可能是水分，不足以判断。',
        expected: '到第 10–14 天，趋势才有意义。',
        notes: notes
      };
    }

    var d14 = windowDelta(pts, 14) || windowDelta(pts, 7);
    var slope = slopePerWeek(pts, 21);
    var speed = d14 ? d14.pctPerWeek : (slope ? slope.pctPerWeek : 0);
    var targetSpeed = t.expectedLossPct;
    var stats = recentStats(entries, today);
    var ts = trainingStats(entries, today);
    var ad = adaptiveTdee(entries, { windowDays: 21 });

    /* ---- 主判断 ---- */
    var out = null;
    if (speed > 0.05) {
      out = {
        status: 'gain', tag: '注意',
        title: '在涨（' + pct(speed) + '/周）',
        action: '这周先不动热量，先把摄入记录补准（尤其油、饮料、零食）。',
        reason: '记录缺口最常见的原因不是"吃多了"，而是"没记全"。',
        expected: '记录补全后，下周要么速度转负，要么能确认真的吃超了。'
      };
    } else if (Math.abs(speed) < Math.max(0.15, targetSpeed * 0.4)) {
      out = {
        status: 'stall', tag: '该改',
        title: '两周下来几乎没动（' + pct(speed) + '/周）',
        action: ctx.suggestCardioFirst
          ? '每天多走 2000 步（约 20–25 分钟）。热量先不动。'
          : '每天热量 −150 kcal（约等于少一碗米饭 + 一勺油）。',
        reason: '代谢会随体重下降而降低，缺口被吃回来了，需要重新造一个。',
        expected: '下周周均应下降 0.4–0.8% 体重；没动就换另一个变量。'
      };
    } else if (Math.abs(speed) > 1.05) {
      out = {
        status: 'fast', tag: '注意',
        title: '掉得偏快（' + pct(speed) + '/周）',
        action: '每天加回 150 kcal（优先加碳水和蛋白，不是加脂肪）。',
        reason: '一周超过体重 1% 时，掉的不只是脂肪，还有肌肉和水分。',
        expected: '下周速度回落到 0.5–1% 区间。'
      };
    } else {
      out = {
        status: 'ok', tag: '保持',
        title: '速度在区间内（' + pct(speed) + '/周）',
        action: '这周什么都别改，按现在的量继续。',
        reason: '目标区间是 −' + fmt(targetSpeed, 2) + '%/周，你已经在里面。',
        expected: '继续保持，4 周后看一次整体进度。'
      };
    }

    /* ---- 附注（不改变动作） ---- */
    if (stats.proteinDays >= 3 && stats.avgProtein !== null && stats.avgProtein < t.protein * 0.85) {
      notes.push('蛋白平均 ' + fmt(stats.avgProtein, 0) + 'g，低于目标 ' + fmt(t.protein, 0) + 'g。缺口期蛋白不够，掉的不只是脂肪。');
    }
    if (stats.kcalDays < 4) {
      notes.push('本周只有 ' + stats.kcalDays + ' 天记了热量。速度判断仍然有效，但没法反推真实消耗。');
    }
    if (stats.stepsDays >= 3 && stats.avgSteps !== null && stats.avgSteps < 6000) {
      notes.push('日均步数 ' + fmt(stats.avgSteps, 0) + '，偏低。走路是最不容易反弹的有氧，先拉到 8000。');
    }
    if (stats.sleepDays >= 3 && stats.avgSleep !== null && stats.avgSleep < 6.5) {
      notes.push('平均睡眠 ' + fmt(stats.avgSleep, 1) + ' 小时。睡不够会拉高饥饿感，缺口再准也很难执行。');
    }
    if (ad.ok && Math.abs(ad.tdee - t.tdee) / t.tdee > 0.08) {
      notes.push('实测消耗约 ' + fmt(ad.tdee, 0) + ' kcal/天，和公式估的 ' + fmt(t.tdee, 0) + ' 差了 ' +
        fmt(Math.abs(ad.tdee - t.tdee) / t.tdee * 100, 0) + '%。以实测为准，可在设置里把活动量改一档。');
    }
    if (t.clamped) {
      notes.push('按你选的速度需要吃到 ' + fmt(t.rawKcal, 0) + ' kcal，已压到基础代谢附近（' + fmt(t.kcal, 0) + '）。想更快就加步数，别再降摄入。');
    }

    /* ---- 训练相关的保肌提示（只提示，不改变本周动作） ---- */
    if (ts.prevWeekCount >= 2 && ts.weekCount <= Math.floor(ts.prevWeekCount * 0.6)) {
      notes.push('训练次数从 ' + ts.prevWeekCount + ' 次降到 ' + ts.weekCount + ' 次。训练量掉下来时不要继续加有氧，先确认吃得够、睡得够。');
    } else if (ts.weekCount === 0 && spanDays >= 14) {
      notes.push('最近 7 天没有训练记录。减脂期完全不做力量训练，掉的体重里肌肉占比会更高。');
    } else if (ts.weekCount >= 2 && ts.strengthThisWeek === 0) {
      notes.push('这周只有有氧、没有力量训练。每周至少 2 次力量，是"掉脂肪不掉肌肉"的最低要求。');
    }

    out.notes = notes;
    out.training = ts;
    out.speed = speed;
    out.delta14 = d14;
    out.slope = slope;
    out.adaptive = ad;
    out.stats = stats;
    out.nextReview = addDays(today, 7);
    return out;
  }

  return {
    pad: pad, fmtDate: fmtDate, parseDate: parseDate, addDays: addDays, dayDiff: dayDiff,
    todayStr: todayStr, weekdayCN: weekdayCN, shortCN: shortCN,
    num: num, fmt: fmt, pct: pct,
    targets: targets,
    weightPoints: weightPoints, weightMap: weightMap, ma7At: ma7At, maSeries: maSeries,
    windowDelta: windowDelta, slopePerWeek: slopePerWeek,
    adaptiveTdee: adaptiveTdee, recentStats: recentStats, streakDays: streakDays,
    progress: progress,
    trainingStats: trainingStats, isTraining: isTraining, TRAIN_TYPES: TRAIN_TYPES,
    decide: decide
  };
});

</script>
<script>
/* FitLoop — UI 层（依赖 logic.js 暴露的 FitLogic） */
(function () {
  'use strict';
  var L = window.FitLogic;
  var KEY = 'fitloop.v1';
  var $ = function (id) { return document.getElementById(id); };

  var DEFAULTS = {
    profile: { sex: 'm', age: 28, height: 175, weight: 80, goal: 72, activity: 1.375, ratePct: 0.75, proteinPerKg: 1.8 },
    settings: { cardioFirst: false }
  };

  /* ---------------- 状态 ---------------- */
  var state = load();

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return { profile: null, entries: [], decisions: [], settings: { cardioFirst: false } };
      var s = JSON.parse(raw);
      var profile = s.profile ? Object.assign({}, DEFAULTS.profile, s.profile) : null;
      return {
        profile: profile,
        entries: Array.isArray(s.entries) ? s.entries.filter(function (e) {
          return e && /^\d{4}-\d{2}-\d{2}$/.test(e.date || '');
        }) : [],
        decisions: Array.isArray(s.decisions) ? s.decisions : [],
        settings: Object.assign({}, DEFAULTS.settings, s.settings || {})
      };
    } catch (e) {
      return { profile: null, entries: [], decisions: [], settings: { cardioFirst: false } };
    }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { toast('存储失败，可能空间满了或隐私模式'); }
  }

  /* ---------------- 小工具 ---------------- */
  var toastTimer = null;
  function toast(msg) {
    var el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2400);
  }
  function effectiveProfile() {
    // 目标热量应该用最近一次实测体重，而不是设置里那个静态数字
    if (!state.profile) return null;
    var pts = L.weightPoints(state.entries);
    if (!pts.length) return state.profile;
    return Object.assign({}, state.profile, { weight: pts[pts.length - 1].w });
  }
  function today() { return L.todayStr(); }

  /* ---------------- KPI ---------------- */
  function renderKpisMinimal() {
    var pts = L.weightPoints(state.entries);
    var last = pts.length ? pts[pts.length - 1] : null;
    var ma = last ? L.ma7At(L.weightMap(pts), last.date) : null;
    var streak = L.streakDays(state.entries, today());
    $('kpis').innerHTML =
      '<div class="kpi"><div class="k">7 日均重</div><div class="v">' +
      (last ? L.fmt(last.w, 1) + '<small>kg</small>' : '—<small>kg</small>') +
      '</div><div class="n">' + (last ? '均线 ' + L.fmt(ma, 1) + ' kg' : '还没有记录') + '</div></div>' +
      '<div class="kpi"><div class="k">连续记录</div><div class="v">' + streak + '<small>天</small></div>' +
      '<div class="n">填完身体数据算目标</div></div>';
  }

  function renderKpis(t, ctx, p) {
    var pts = L.weightPoints(state.entries);
    var last = pts.length ? pts[pts.length - 1] : null;
    var ma = last ? L.ma7At(L.weightMap(pts), last.date) : null;
    var d14 = L.windowDelta(pts, 14);
    // 进度以第一条体重为起点，否则"起点"会跟着当前体重走，永远显示 0%
    var pr = L.progress(state.entries, p);
    var goal = pr.goal;
    var remain = pr.remain === null ? 0 : pr.remain;
    var done = pr.donePct;
    var streak = L.streakDays(state.entries, today());

    var speedPct = d14 ? d14.pctPerWeek : null;
    var speedCls = '';
    if (speedPct !== null) {
      if (speedPct > 0) speedCls = 'bad';
      else if (Math.abs(speedPct) < Math.max(0.15, t.expectedLossPct * 0.4)) speedCls = 'bad';
      else if (Math.abs(speedPct) > 1.05) speedCls = 'bad';
      else speedCls = 'good';
    }

    var html = '';
    html += '<div class="kpi"><div class="k">7 日均重</div><div class="v">' +
      (last ? L.fmt(last.w, 1) + '<small>kg</small>' : '—<small>kg</small>') +
      '</div><div class="n">' + (last ? '均线 ' + L.fmt(ma, 1) + ' kg · ' + L.shortCN(last.date) : '还没有记录') + '</div></div>';

    html += '<div class="kpi"><div class="k">14 天速度</div><div class="v">' +
      (speedPct === null ? '—' : L.pct(speedPct)) +
      '</div><div class="n ' + speedCls + '">' +
      (speedPct === null ? '数据不足' : '目标 −' + L.fmt(t.expectedLossPct, 2) + '%/周') + '</div></div>';

    html += '<div class="kpi"><div class="k">距目标</div><div class="v">' + L.fmt(Math.max(0, remain), 1) +
      '<small>kg</small></div><div class="n">已完成 ' + L.fmt(done, 0) + '%</div></div>';

    html += '<div class="kpi"><div class="k">连续记录</div><div class="v">' + streak +
      '<small>天</small></div><div class="n">目标 ' + L.fmt(t.kcal, 0) + ' kcal · 蛋白 ' + L.fmt(t.protein, 0) + ' g</div></div>';

    $('kpis').innerHTML = html;
  }

  /* ---------------- 决策卡 ---------------- */
  function renderDecision(dec) {
    var el = $('decision');
    var cls = dec.status === 'ok' ? '' : (dec.status === 'need-data' ? 'idle' : 'warn');
    var tagCls = dec.tag === '保持' ? '' : (dec.tag === '先记数据' ? 'idle' : 'warn');
    var html = '<span class="tag ' + tagCls + '">' + dec.tag + '</span>';
    html += '<p class="d-title">' + esc(dec.title) + '</p>';
    html += '<p class="d-action">' + esc(dec.action) + '</p>';
    html += '<div class="d-row"><b>为什么</b><span>' + esc(dec.reason) + '</span></div>';
    html += '<div class="d-row"><b>预期</b><span>' + esc(dec.expected) + '</span></div>';
    if (dec.notes && dec.notes.length) {
      html += '<ul class="notes">' + dec.notes.map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('') + '</ul>';
    }

    // 采纳 / 忽略（只在真正给出动作时出现）
    if (dec.status !== 'need-data') {
      var todayRec = state.decisions.filter(function (d) { return d.date === today(); }).pop();
      if (todayRec) {
        html += '<div class="d-btns"><button disabled style="opacity:.6">' +
          (todayRec.adopted ? '已采纳，7 天后回来看效果' : '已忽略，本周不变') + '</button></div>';
      } else {
        html += '<div class="d-btns">' +
          '<button type="button" data-act="adopt">采纳这条</button>' +
          '<button type="button" data-act="skip">这周不改</button></div>';
      }
    }

    // 上次采纳的效果验证
    var check = lastAdoptedReview(dec);
    if (check) {
      html += '<ul class="notes" style="margin-top:10px"><li>' + esc(check) + '</li></ul>';
    }

    el.className = 'card ' + cls;
    el.innerHTML = html;
    el.querySelectorAll('button[data-act]').forEach(function (b) {
      b.addEventListener('click', function () {
        var adopted = b.getAttribute('data-act') === 'adopt';
        state.decisions.push({
          date: today(), adopted: adopted, tag: dec.tag, title: dec.title,
          action: dec.action, status: dec.status,
          speedAt: dec.speed === undefined ? null : dec.speed
        });
        save();
        toast(adopted ? '已记录，7 天后自动回看效果' : '这周保持不动');
        render();
      });
    });
  }

  function lastAdoptedReview(dec) {
    var picks = state.decisions.filter(function (d) { return d.adopted; })
      .sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    if (!picks.length) return '';
    var last = picks[0];
    var gap = L.dayDiff(last.date, today());
    if (gap < 7) return '';
    if (dec.speed === undefined || dec.speed === null) return '';
    var old = last.speedAt;
    if (old === null || old === undefined) return '';
    var nowV = dec.speed;
    var improved = nowV < old - 0.05;
    return '上次调整（' + last.date + '，' + gap + ' 天前）：' +
      (improved ? '生效了' : '没明显变化') +
      '，速度从 ' + L.pct(old) + ' 变成 ' + L.pct(nowV) +
      (improved ? '。' : '。可以考虑换另一个变量再试一周。');
  }

  /* ---------------- 图表 ---------------- */
  function renderChart() {
    var cv = $('chart');
    if (!cv) return;
    var dpr = window.devicePixelRatio || 1;
    var w = cv.parentElement.clientWidth - 30;
    if (w < 120) w = 120;
    var h = 230;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    cv.style.height = h + 'px';
    var ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    var pts = L.weightPoints(state.entries);
    var goal = state.profile ? state.profile.goal : null;

    if (pts.length < 2) {
      ctx.fillStyle = '#a8afa6';
      ctx.font = '12.5px -apple-system,"PingFang SC","Noto Sans SC",sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(pts.length ? '再记 1 天，就能看到趋势线' : '记录 2 天体重后出现趋势', w / 2, h / 2);
      return;
    }

    var ma = L.maSeries(pts);
    var first = pts[0].date, last = pts[pts.length - 1].date;
    var span = Math.max(1, L.dayDiff(first, last));
    var vals = pts.map(function (p) { return p.w; });
    if (goal) vals.push(goal);
    var minV = Math.min.apply(null, vals), maxV = Math.max.apply(null, vals);
    var pad = Math.max(0.6, (maxV - minV) * 0.16);
    minV -= pad; maxV += pad;

    var ML = 34, MR = 8, MT = 10, MB = 18;
    var pw = w - ML - MR, ph = h - MT - MB;
    function X(d) { return ML + (L.dayDiff(first, d) / span) * pw; }
    function Y(v) { return MT + (1 - (v - minV) / (maxV - minV)) * ph; }

    // 网格
    ctx.strokeStyle = '#eef0ec'; ctx.lineWidth = 1;
    ctx.fillStyle = '#a8afa6'; ctx.font = '10px -apple-system,"PingFang SC",sans-serif'; ctx.textAlign = 'right';
    for (var i = 0; i <= 4; i++) {
      var v = minV + (maxV - minV) * i / 4;
      var y = Y(v);
      ctx.beginPath(); ctx.moveTo(ML, y); ctx.lineTo(w - MR, y); ctx.stroke();
      ctx.fillText(v.toFixed(1), ML - 6, y + 3);
    }
    // x 轴（首尾贴边对齐，避免最后一个标签被裁掉）
    var labels = Math.min(4, span);
    for (var j = 0; j <= labels; j++) {
      var dd = L.addDays(first, Math.round(span * j / labels));
      var x = X(dd);
      if (j === 0) { ctx.textAlign = 'left'; x = ML; }
      else if (j === labels) { ctx.textAlign = 'right'; x = w - MR; }
      else { ctx.textAlign = 'center'; }
      ctx.fillText(L.shortCN(dd), x, h - 5);
    }
    // 目标线
    if (goal) {
      ctx.save(); ctx.setLineDash([4, 4]); ctx.strokeStyle = '#bcc3b9';
      ctx.beginPath(); ctx.moveTo(ML, Y(goal)); ctx.lineTo(w - MR, Y(goal)); ctx.stroke(); ctx.restore();
    }
    // 原始点
    ctx.fillStyle = 'rgba(18,148,90,.25)';
    pts.forEach(function (p) {
      ctx.beginPath(); ctx.arc(X(p.date), Y(p.w), 2, 0, Math.PI * 2); ctx.fill();
    });
    // 7 日均线
    var seg = ma.filter(function (p) { return p.ma7 !== null; });
    if (seg.length > 1) {
      ctx.strokeStyle = '#12945a'; ctx.lineWidth = 2.2; ctx.lineJoin = 'round';
      ctx.beginPath();
      seg.forEach(function (p, k) {
        var x = X(p.date), y = Y(p.ma7);
        k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      });
      ctx.stroke();
      var lastP = seg[seg.length - 1];
      ctx.fillStyle = '#12945a';
      ctx.beginPath(); ctx.arc(X(lastP.date), Y(lastP.ma7), 2.8, 0, Math.PI * 2); ctx.fill();
    }
  }

  /* ---------------- 列表 ---------------- */
  function renderList() {
    var rows = state.entries.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; }).slice(0, 14);
    var el = $('list');
    if (!rows.length) { el.innerHTML = '<div class="empty">还没有记录，先存今天的晨重</div>'; return; }
    el.innerHTML = rows.map(function (e) {
      var bits = [];
      if (e.kcal) bits.push(e.kcal + ' kcal');
      if (e.protein) bits.push('蛋白 ' + e.protein + 'g');
      if (e.steps) bits.push(e.steps + ' 步');
      if (e.cardio) bits.push('有氧 ' + e.cardio + '′');
      if (e.lifting) bits.push('力量');
      if (e.sleep) bits.push('睡 ' + e.sleep + 'h');
      return '<div class="row">' +
        '<span class="date">' + L.shortCN(e.date) + ' 周' + L.weekdayCN(e.date) + '</span>' +
        '<span class="val">' + (e.weight ? L.fmt(e.weight, 1) : '—') + '</span>' +
        '<span class="extra">' + esc(bits.join(' · ')) + '</span>' +
        '<button class="del" data-date="' + e.date + '" aria-label="删除">✕</button>' +
        '</div>';
    }).join('');
    el.querySelectorAll('.del').forEach(function (b) {
      b.addEventListener('click', function () {
        var d = b.getAttribute('data-date');
        if (!confirm('删除 ' + d + ' 这条记录？')) return;
        state.entries = state.entries.filter(function (e) { return e.date !== d; });
        save(); render(); toast('已删除 ' + d);
      });
    });
  }

  /* ---------------- 渲染总入口 ---------------- */
  function render() {
    var p = effectiveProfile();
    if (!p) { $('decision').innerHTML = '<span class="tag idle">第一步</span><p class="d-title">先填一下身体数据</p><p class="d-action">点右上角 ⚙，填完就知道每天该吃多少。</p>'; }
    var t = p ? L.targets(p) : null;
    var dec = p ? L.decide({ profile: p, target: t, entries: state.entries, today: today(), suggestCardioFirst: state.settings.cardioFirst })
      : { status: 'need-data', tag: '先记数据', title: '还没有身体数据', action: '点右上角 ⚙ 填一次。', reason: '目标热量要用你的身高体重算。', expected: '填完就能开始记。', notes: [] };
    renderDecision(dec);
    if (t && p) renderKpis(t, dec, p); else renderKpisMinimal();
    renderChart();
    renderList();
    renderTraining();
  }

  function esc(s) {
    return String(s === undefined || s === null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /* ---------------- 事件：打卡 ---------------- */
  function upsert(entry) {
    var i = -1;
    state.entries.forEach(function (e, idx) { if (e.date === entry.date) i = idx; });
    if (i >= 0) state.entries[i] = Object.assign({}, state.entries[i], entry);
    else state.entries.push(entry);
  }

  $('entryForm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var f = ev.target;
    var date = f.date.value || today();
    var weight = L.num(f.weight.value);
    var kcal = L.num(f.kcal.value);
    var protein = L.num(f.protein.value);
    var steps = L.num(f.steps.value);
    var cardio = L.num(f.cardio.value);
    var sleep = L.num(f.sleep.value);
    var lifting = !!f.lifting.checked;

    if (weight === null && kcal === null && protein === null && steps === null && cardio === null && sleep === null && !lifting) {
      toast('至少填一个数'); return;
    }
    // 只更新填了的字段，避免把之前记过的数据清空
    var patch = { date: date };
    if (weight !== null) patch.weight = weight;
    if (kcal !== null) patch.kcal = kcal;
    if (protein !== null) patch.protein = protein;
    if (steps !== null) patch.steps = steps;
    if (cardio !== null) patch.cardio = cardio;
    if (sleep !== null) patch.sleep = sleep;
    patch.lifting = lifting;
    upsert(patch);
    save();
    render();
    toast(weight ? '已记录 ' + L.fmt(weight, 1) + ' kg · ' + L.shortCN(date) : '已记录 ' + L.shortCN(date));

    // 只清掉数值，保留日期方便补记
    ['weight', 'kcal', 'protein', 'steps', 'cardio', 'sleep'].forEach(function (k) { f[k].value = ''; });
    f.lifting.checked = false;
    $('wInput').focus();
  });

  /* ---------------- 训练（L1：部位 + 时长 + RPE） ---------------- */
  var trainType = null;

  function selectedDate() {
    var d = $('entryForm').date.value;
    return d || today();
  }

  function paintChips() {
    document.querySelectorAll('#chips .chip').forEach(function (b) {
      b.classList.toggle('on', b.getAttribute('data-type') === trainType);
    });
  }

  function renderTraining() {
    var date = selectedDate();
    var entry = state.entries.filter(function (e) { return e.date === date; })[0] || null;
    trainType = entry && entry.trainType ? entry.trainType : null;

    document.querySelectorAll('#chips .chip').forEach(function (b) {
      b.classList.toggle('on', b.getAttribute('data-type') === trainType);
    });
    $('trainHint').textContent = trainType ? '再点一次可取消' : '点一个部位，再保存';

    var f = $('trainForm');
    f.trainMin.value = entry && entry.trainMin ? entry.trainMin : '';
    f.rpe.value = entry && entry.rpe ? String(entry.rpe) : '';
    f.note.value = entry && entry.note ? entry.note : '';

    $('trainDateLabel').textContent = date === today() ? '今天' : L.shortCN(date);

    var ts = L.trainingStats(state.entries, today());
    var bits = [];
    bits.push('近 7 天 <b>' + ts.weekCount + '</b> 次' + (ts.weekMinutes ? ' · ' + ts.weekMinutes + ' 分钟' : ''));
    if (ts.strengthThisWeek > 0 && ts.strengthThisWeek < ts.weekCount) bits.push('力量 <b>' + ts.strengthThisWeek + '</b> 次');
    if (ts.lastTypeLabel) bits.push('上次练' + ts.lastTypeLabel + ' · ' + (ts.lastDaysAgo === 0 ? '今天' : ts.lastDaysAgo + ' 天前'));
    bits.push('近 4 周 ' + ts.byWeek.join(' / '));
    $('trainSum').innerHTML = bits.join('　·　');
  }

  document.querySelectorAll('#chips .chip').forEach(function (b) {
    b.addEventListener('click', function () {
      var t = b.getAttribute('data-type');
      trainType = (trainType === t) ? null : t;
      document.querySelectorAll('#chips .chip').forEach(function (x) {
        x.classList.toggle('on', x.getAttribute('data-type') === trainType);
      });
      $('trainHint').textContent = trainType ? '再点一次可取消' : '点一个部位，再保存';
    });
  });

  $('trainForm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var f = ev.target;
    var date = selectedDate();
    var min = L.num(f.trainMin.value);
    var rpe = L.num(f.rpe.value);
    var note = (f.note.value || '').trim();
    if (!trainType && min === null && !note) { toast('先点一个部位'); return; }
    var patch = { date: date };
    if (trainType) patch.trainType = trainType;
    if (min !== null) patch.trainMin = min;
    if (rpe !== null) patch.rpe = rpe;
    if (note) patch.note = note;
    upsert(patch);
    save();
    render();
    toast('已记录训练 · ' + L.shortCN(date));
  });

  /* ---------------- 事件：设置 ---------------- */
  function openSheet() {
    var f = $('profileForm');
    var p = state.profile || DEFAULTS.profile;
    f.sex.value = p.sex; f.age.value = p.age; f.height.value = p.height;
    f.weight.value = p.weight; f.goal.value = p.goal;
    f.activity.value = String(p.activity); f.ratePct.value = String(p.ratePct);
    f.proteinPerKg.value = p.proteinPerKg;
    f.cardioFirst.checked = !!state.settings.cardioFirst;
    $('sheet').classList.add('open');
  }
  function closeSheet() { $('sheet').classList.remove('open'); }

  $('btnSettings').addEventListener('click', openSheet);
  $('closeSheet').addEventListener('click', closeSheet);
  $('sheet').addEventListener('click', function (e) { if (e.target === $('sheet')) closeSheet(); });

  $('profileForm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var f = ev.target;
    var p = {
      sex: f.sex.value,
      age: Math.round(L.num(f.age.value)) || 28,
      height: L.num(f.height.value) || 175,
      weight: L.num(f.weight.value) || 80,
      goal: L.num(f.goal.value) || 72,
      activity: L.num(f.activity.value) || 1.375,
      ratePct: L.num(f.ratePct.value) || 0.75,
      proteinPerKg: L.num(f.proteinPerKg.value) || 1.8
    };
    if (!(p.age > 10) || !(p.height > 100) || !(p.weight > 20) || !(p.goal > 20)) { toast('数值看起来不对，检查一下'); return; }
    state.profile = p;
    state.settings.cardioFirst = !!f.cardioFirst.checked;
    save(); closeSheet(); render();
    toast('已保存，目标是 ' + L.fmt(L.targets(p).kcal, 0) + ' kcal/天');
  });

  /* ---------------- 事件：备份 ---------------- */
  $('btnExport').addEventListener('click', function () {
    var data = JSON.stringify({ v: 1, exportedAt: new Date().toISOString(), profile: state.profile, entries: state.entries, decisions: state.decisions, settings: state.settings }, null, 2);
    var blob = new Blob([data], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'fitloop-backup-' + today() + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1500);
    toast('备份已下载，建议存到网盘');
  });

  $('btnImport').addEventListener('click', function () { $('fileInput').click(); });
  $('fileInput').addEventListener('change', function (ev) {
    var file = ev.target.files && ev.target.files[0];
    if (!file) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var s = JSON.parse(String(r.result));
        if (!s || !Array.isArray(s.entries)) throw new Error('不是 FitLoop 的备份文件');
        if (!confirm('导入会覆盖当前所有记录，确定？')) { ev.target.value = ''; return; }
        state = {
          profile: s.profile ? Object.assign({}, DEFAULTS.profile, s.profile) : state.profile,
          entries: s.entries.filter(function (e) { return e && /^\d{4}-\d{2}-\d{2}$/.test(e.date || ''); }),
          decisions: Array.isArray(s.decisions) ? s.decisions : [],
          settings: Object.assign({}, DEFAULTS.settings, s.settings || {})
        };
        save(); render();
        toast('已导入 ' + state.entries.length + ' 条记录');
      } catch (err) {
        toast('导入失败：' + err.message);
      }
      ev.target.value = '';
    };
    r.readAsText(file);
  });

  /* ---------------- 启动 ---------------- */
  $('entryForm').date.value = today();
  window.addEventListener('resize', function () { clearTimeout(window.__rt); window.__rt = setTimeout(renderChart, 120); });
  if (!state.profile) { openSheet(); }
  render();

  // 日期切换时提示当天是否已有记录
  $('entryForm').date.addEventListener('change', function () {
    var d = this.value;
    var hit = state.entries.filter(function (e) { return e.date === d; })[0];
    if (hit) {
      $('wInput').value = hit.weight || '';
      $('entryForm').kcal.value = hit.kcal || '';
      $('entryForm').protein.value = hit.protein || '';
      $('entryForm').steps.value = hit.steps || '';
      $('entryForm').cardio.value = hit.cardio || '';
      $('entryForm').sleep.value = hit.sleep || '';
      $('entryForm').lifting.checked = !!hit.lifting;
      toast('这天已有记录，保存会更新');
    }
    renderTraining();
  });

  /* Service Worker：离线可用 */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () { /* file:// 下会失败，正常 */ });
    });
  }
})();

</script>
</body>
</html>
